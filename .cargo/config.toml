# SPDX-License-Identifier: MPL-2.0
# Branch bootstrap: `cargo fmt` is aliased to a tiny helper that vendors locked
# dependencies on CI, records the source replacement, then calls cargo-fmt.
# Remove the alias and source replacement after offline verification is complete.
[alias]
fmt = "run --quiet --manifest-path tools/vendor-fmt/Cargo.toml --"

[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"
