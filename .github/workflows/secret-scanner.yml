# SPDX-License-Identifier: MPL-2.0
# Calls the estate's shared secret scanner (gitleaks + rust-secrets +
# shell-secrets).
#
# ⚠ THE OWNER SPELLING IS LOAD-BEARING: `metadatastician/standards`, and
# it was measured, not guessed.
#
# The shared reusable lives in `metadatastician/standards`. The repository
# was transferred to the `metadatastician` organisation, and GitHub's REST
# API follows the old name (`GET /repos/hyperpolymath/standards` answers
# `full_name: metadatastician/standards`). The ACTIONS resolver does NOT.
#
# Measured in this repository, on the same pinned commit, with the same
# job key and the same grants:
#
#   uses: hyperpolymath/standards/.github/workflows/secret-scanner-reusable.yml@<sha>
#     -> no job starts, and the run is attributed to the workflow FILE
#        (`.github/workflows/secret-scanner.yml`), not to the workflow.
#        Conclusion: `failure`. Zero jobs.
#
#   uses: metadatastician/standards/.github/workflows/secret-scanner-reusable.yml@<sha>
#     -> the workflow starts, the reusable's own jobs run, and the check
#        is published under the context the ruleset requires.
#
# The failure mode of the old spelling is the nastiest kind: there is no
# job to read a log from, and the run carries the file's name, so it does
# not even look like the workflow it is. The only way to see it is
# `gh run list --json conclusion`.
#
# The estate's `Secret-Scan-Floor` ruleset requires the context
# `scan / gitleaks`. It is produced by this repository's `scan` job
# calling the reusable, whose own job is named `gitleaks`. The job key
# MUST stay `scan`.
#
# The PIN is equally load-bearing. A stale pin is a different failure with
# the same silence: the reusable at an old commit asked for more
# permission than the caller grants, and a called workflow cannot exceed
# its caller's job-level grant, so the call is refused at startup with
# `startup_failure` and no job. `cf8f9121` is the commit whose own
# actions.lock GitHub accepts at job setup.
#
# No `secrets:` line, deliberately: the reusable declares no
# `workflow_call.secrets` and references no `secrets.*` context, so
# `secrets: inherit` is both an error (there is nothing to inherit) and a
# hazard (it would forward every repository and organisation secret the
# caller can see — CWE-250).
name: "Secret Scanner"

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    # Declared explicitly rather than inherited. A job-level
    # `permissions:` block REPLACES the workflow-level one; it does not
    # merge with it. Declaring it here means a future widening of the
    # workflow-level block cannot silently re-break the caller.
    permissions:
      contents: read
    uses: metadatastician/standards/.github/workflows/secret-scanner-reusable.yml@cf8f91219d80da55cf8cbbfcd587d00c2d8798ed
