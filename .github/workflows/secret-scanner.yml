# SPDX-License-Identifier: MPL-2.0
# Calls the estate's shared secret scanner (gitleaks + rust-secrets +
# shell-secrets). Added because this repository had NO leak scanning at all.
name: "Secret Scanner"
on:
  pull_request:
  push:
    branches: [main, master]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  scan:
    uses: metadatastician/standards/.github/workflows/secret-scanner-reusable.yml@1f3eef621985b2dd0e7e2d3ac265c0f0ba6b0a78
