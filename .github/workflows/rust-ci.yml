# SPDX-License-Identifier: MPL-2.0
name: rust-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87  # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        env:
          RUSTFLAGS: "-D warnings"
      - name: test
        run: cargo test --workspace
      - name: build
        run: cargo build --release
      - name: e2e
        run: bash tests/e2e.sh
      - name: e2e non-vacuity (stub binary must fail the suite)
        run: |
          if PONS_BIN=/bin/true bash tests/e2e.sh >/dev/null 2>&1; then
            echo "::error::e2e suite passes against a stub binary — it is vacuous"
            exit 1
          fi
          echo "e2e suite correctly rejects a stub binary"
