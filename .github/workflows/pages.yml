# SPDX-License-Identifier: MPL-2.0
# Build documentation for review. No Pages deployment or site claim.
name: Documentation build
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  asciidoc:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the documentation renderer
        run: sudo apt-get update && sudo apt-get install -y asciidoctor
      - name: Render maintained guides
        run: |
          mkdir -p target/docs
          asciidoctor --safe-mode safe --failure-level WARN -a reproducible -D target/docs README.adoc docs/USAGE.adoc docs/SCOPE.adoc docs/catalogue.adoc
