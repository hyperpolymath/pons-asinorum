# SPDX-License-Identifier: MPL-2.0
# DEED conformance lane.
#
# Calls the estate's shared DEED linter (grammar v1.2.0, normative) over every
# committed *.deed file. `require-files: true` fails the job if the repository
# somehow loses its deeds entirely — a zero-file run is otherwise a pass, which
# is exactly the "gate that could never fire" defect the estate has paid for
# before.
#
# ⚠ THE OWNER SPELLING IS LOAD-BEARING: `metadatastician/standards`. The
# repository was transferred to the `metadatastician` organisation; GitHub's
# REST API follows the old name but the Actions resolver does NOT (measured
# here on the secret-scanner lane, PR #64). `uses:` MUST use the new spelling.
#
# ⚠ THE PIN IS EQUALLY LOAD-BEARING, and it is not "latest master": a call
# pinned to master (`8e48b1c`) was refused at job setup (`startup_failure`,
# no job, no log — the failure mode documented in secret-scanner.yml), while
# the call pinned to `cf8f9121` — the same commit the secret-scanner lane
# already runs, whose own actions.lock GitHub accepts — starts and runs, and
# `deed-conformance.yml` exists at that commit. When the estate publishes a
# newer accepted pin carrying newer linter behaviour, re-pin deliberately and
# watch the first run.

name: deed-conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deed:
    permissions:
      contents: read
    uses: metadatastician/standards/.github/workflows/deed-conformance.yml@cf8f91219d80da55cf8cbbfcd587d00c2d8798ed
    with:
      require-files: true
