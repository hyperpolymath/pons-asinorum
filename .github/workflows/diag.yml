# TEMPORARY: delete before merge.
name: diag

on:
  push:
    branches: [arena/89d9b7ce-pons-asinorum]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: true
      - name: toolchain
        run: |
          rustup toolchain install
          rustc --version
      - name: collect
        run: |
          mkdir -p diag
          set +e
          cargo fmt --check > diag/fmt.txt 2>&1
          echo "fmt exit: $?" > diag/summary.txt
          cargo fmt >> diag/summary.txt 2>&1
          cargo clippy --workspace --all-targets -- -D warnings > diag/clippy.txt 2>&1
          echo "clippy exit: $?" >> diag/summary.txt
          cargo test --workspace --no-fail-fast > diag/test.txt 2>&1
          echo "test exit: $?" >> diag/summary.txt
          bash tests/e2e.sh > diag/e2e.txt 2>&1
          echo "e2e exit: $?" >> diag/summary.txt
          cat diag/summary.txt
      - name: report back
        run: |
          set -euo pipefail
          git config user.name "pons diag"
          git config user.email "diag@invalid"
          git add -A diag crates schemas
          if git diff --cached --quiet; then echo "nothing to report"; exit 0; fi
          git commit -m "diag: formatted sources and captured toolchain output [skip ci]"
          git push origin HEAD:arena/89d9b7ce-pons-asinorum
