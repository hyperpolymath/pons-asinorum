# SPDX-License-Identifier: MPL-2.0
name: Central Estate CI/CD Audit

# Thin caller of the estate audit, which lives in hyperpolymath/cicd-suite as
# a reusable workflow and reports five component checks: governance,
# hygiene, manifests, languages, advisory. Do not copy the audit's steps in
# here. A copy freezes this repository at whatever cicd-suite commit its
# actions.lock happened to hold, and fixes made upstream never arrive.
#
# THE PIN, AND WHY IT MOVED
# -------------------------
# This file pinned cicd-suite 3bbdf75 (the single-job, 26-step audit). That
# revision is two generations behind:
#
#   * cicd-suite#50 (376898b) split the audit into five component jobs, so a
#     failing gate no longer hides the other 25 behind one red square, and
#     every failing gate is reported at once.
#   * cicd-suite#54 (9a947fa) added the language gates (Rust CI, Creusot,
#     SPARK, miniKanren) and replaced zig-hexadeca-check with
#     zig-unified-api-adapter-check.
#
# The old pin still ran, so nothing was RED — it was simply a stale audit
# that could never report a gate that had been fixed or added upstream.
# The pin is now cicd-suite main at the SHA below, whose own runs are green
# (Central Estate CI/CD Audit, Secret Scanner, Language Gates Self-Test and
# Code Hygiene Self-Test all pass at bf7dd95).
#
# Re-pinning by hand is the fallback; `track-estate-audit.yml` moves the pin
# to cicd-suite HEAD weekly and opens a pull request whose own audit run is
# the check. Nothing reaches main unreviewed.
#
# ⚠ DE-ONBOARDED from actions.lock, deliberately, like the secret-scanner
# caller. A reusable workflow onboarded cross-repo startup-fails with zero
# jobs under sha_pinning_required (see the header of cicd-suite's
# main-estate-audit.yml). Do not run a full-directory `gh actions-lock` that
# re-onboards this file. If one does, cicd-suite/scripts/deonboard-estate-audit.sh
# reverses it.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  estate:
    uses: hyperpolymath/cicd-suite/.github/workflows/main-estate-audit.yml@bf7dd95cf49733019343ff485c2f45c6b261839c # cicd-suite main
