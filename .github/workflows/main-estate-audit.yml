# SPDX-License-Identifier: MPL-2.0
name: Central Estate CI/CD Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
  # Was pinned to @feat/cicd-workflow-call, a branch that no longer exists on
  # cicd-suite. An unresolvable ref is not a failing job — the run dies at
  # startup with jobs=0, so this audit has been reporting nothing at all.
  #
  # Repointed at a full commit SHA on cicd-suite main. That reusable workflow
  # invokes all 26 estate gates from hyperpolymath/cicd-suite/actions/*, which
  # is the canonical copy: vendoring those composites into this repo would fork
  # a snapshot that is already stale (cicd-suite has since replaced
  # zig-hexadeca-check with zig-unified-api-adapter-check).
  #
  # The SHA below is cicd-suite#36 (3bbdf75). Before it, the reusable invoked
  # its 26 gates by BRANCH ref (`cicd-suite/actions/<gate>@main`) and relied on
  # cicd-suite's actions.lock to pin them. That lock is honoured only inside
  # cicd-suite. This repo's Actions policy sets sha_pinning_required, which
  # applies to every step a called reusable runs, so from 2026-09-23 each
  # `@main` ref killed this caller at startup with jobs=0. The earlier pin,
  # 6cb08dd, still dies that way.
  #
  # At 3bbdf75 every gate and the checkout are literal full-SHA refs, and the
  # reusable is no longer in cicd-suite's lock. The ref we call and the
  # composites it runs are therefore fixed by this one SHA, with no lockfile
  # between them. Run 36696994940, on #36's head (same reusable and actions/
  # tree), ran estate-audit 30/30 steps.
  #
  # When re-pinning, check the STEP COUNT, not the square. The gates are only
  # as fresh as the SHA they are pinned to inside the reusable. That drift goes
  # red in cicd-suite's tests/lock-transitive-closure.sh, not silently here.
  call-estate-audit:
    uses: hyperpolymath/cicd-suite/.github/workflows/main-estate-audit.yml@3bbdf75987d120e552f4bc384283c47ee72833eb
