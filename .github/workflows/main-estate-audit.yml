# SPDX-License-Identifier: MPL-2.0
# Replaces the maximal template gate: Pons carries the Rust CLI profile.
name: Repository aspects
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  estate-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the implemented repository aspects
        run: bash tests/aspect_tests.sh
