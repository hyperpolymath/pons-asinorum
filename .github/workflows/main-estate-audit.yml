# SPDX-License-Identifier: MPL-2.0
name: Central Estate CI/CD Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
  # Was pinned to @feat/cicd-workflow-call, a branch that no longer exists on
  # cicd-suite. An unresolvable ref is not a failing job — the run dies at
  # startup with jobs=0, so this audit has been reporting nothing at all.
  #
  # Repointed at a full commit SHA on cicd-suite main. That reusable workflow
  # invokes all 26 estate gates from hyperpolymath/cicd-suite/actions/*, which
  # is the canonical copy: vendoring those composites into this repo would fork
  # a snapshot that is already stale (cicd-suite has since replaced
  # zig-hexadeca-check with zig-unified-api-adapter-check).
  #
  # The SHA below is cicd-suite main as of 2026-09-22: the head of a run whose
  # `Gate controls` job executed 14 steps and whose `Composite shell contract`
  # job executed 6. Both numbers matter. The PREVIOUS pin (3b4afafa) was also
  # "the head of a green run" — but green there meant the self-test never ran,
  # and its composites still carried the harness `-e` kill that fails Required
  # Files Gate here in 41ms, silently, skipping 25 downstream gates.
  # Re-pin on a gate-set change, and check the STEP COUNT, not the square.
  call-estate-audit:
    uses: hyperpolymath/cicd-suite/.github/workflows/main-estate-audit.yml@0c1bc9f5aa5857965e50f96021485d5710b6e0ea
