# SPDX-License-Identifier: MPL-2.0
name: Scorecard

on:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write
  id-token: write

jobs:
  scorecard:
    # Same repaired defining lockfile as the scanner; existing token grants suffice.
    uses: metadatastician/standards/.github/workflows/scorecard-reusable.yml@cf8f91219d80da55cf8cbbfcd587d00c2d8798ed
