# SPDX-License-Identifier: MPL-2.0
[workspace]
members = ["crates/pons-core", "crates/pons-rules", "crates/pons-cli", "crates/pons-protocols"]
resolver = "2"

[workspace.package]
version = "0.1.0-dev.1"
edition = "2024"
rust-version = "1.97"
license = "MPL-2.0"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
repository = "https://github.com/hyperpolymath/pons-asinorum"

[workspace.dependencies]
anyhow = "=1.0.103"
clap = { version = "=4.6.3", features = ["derive"] }
clap_mangen = "=0.2.33"
globset = "=0.4.18"
ignore = "=0.4.25"
regex = "=1.12.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tempfile = "=3.27.0"
toml = "=0.8.23"
tree-sitter = "=0.26.13"
tree-sitter-python = "=0.25.0"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-rust = "=0.24.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
