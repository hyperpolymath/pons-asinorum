# SPDX-License-Identifier: MPL-2.0
[workspace]
resolver = "2"
members = [
    "crates/pons-core",
    "crates/pons-protocols",
    "crates/pons-rules",
    "crates/pons-cli",
]

[workspace.package]
edition = "2021"
license = "MPL-2.0"
authors = ["Jonathan D.A. Jewell"]

[workspace.dependencies]
# Exact pins per docs/PLAN.adoc Appendix F. Every version here equals what
# Cargo.lock already resolved, so these `=` pins freeze the current tree
# rather than moving it. `walkdir` is deliberately absent: Appendix F records
# it as transitive (via `ignore`), and no crate here names it directly.
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
ignore = "=0.4.33"
clap = { version = "=4.6.6", features = ["derive"] }
# Report validation. `default-features = false` drops the `rustls` +
# HTTP reference resolver: the JSON and SARIF schemas are bundled and self-contained,
# so a validator that can reach the network is pure supply-chain surface.
jsonschema = { version = "=0.57.0", default-features = false }
# Explicit operator configuration and scoped suppression.
globset = "=0.4.18"
toml = "=0.8.23"
clap_mangen = "=0.2.33"
