# SPDX-License-Identifier: MPL-2.0
#
# SonarQube Cloud (SonarCloud) configuration for pons-asinorum.
# Project: https://sonarcloud.io/dashboard?id=hyperpolymath_pons
#
# WHAT IS ANALYSED
# The product: the Rust workspace under crates/, the Justfile, the machine
# readable metadata and the workflows. Nothing is excluded wholesale. In
# particular the fixture corpus under fixtures/ is ANALYSED, because a
# fixture is a real PHP sample and a defect in the corpus is worth seeing.
# What is excluded is the build output, which is not source:
sonar.exclusions=target/**,crates/pons-core/tests/golden/**
#
# HOW THIS FILE IS READ — AND BY WHOM
# -----------------------------------
# THIS FILE IS NOT READ BY SONARCLOUD'S AUTOMATIC ANALYSIS.
#
# SonarSource's own documentation states it plainly: "If you import a
# project that already contains a sonar-project.properties file, SonarQube
# Cloud will ignore the parameters in your sonar-project.properties file.
# To analyze your code with the settings defined in this file, you can turn
# off automatic analysis and configure a CI/CD analysis."
# (docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis,
# "Presence of a properties file".)
#
# The "SonarCloud Code Analysis" check this repository reports is the
# AUTOMATIC analysis, so the criteria below are NOT, on their own, what
# makes SonarCloud ignore a diagnostic today. What they are:
#
#   * the DECLARATION of what this repository asks SonarCloud to ignore,
#     in the form a CI-based analysis would read; and
#   * the input to tests/sonar_fixture_gate_test.sh, which fails if this
#     file and the waiver inventory in ci/sonar-fixture-diagnostics.kyaml
#     disagree in either direction.
#
# The effective configuration for the automatic analysis lives in the
# SonarCloud project's own settings, which this repository cannot read or
# write from CI: it has no SonarCloud token, and the API is not reachable
# from the gate. That gap is named in docs/CI-CD.adoc rather than papered
# over, because an unverified configuration is not an assurance.
#
# THE FIXTURE-AWARE QUALITY GATE
# ------------------------------
# Some diagnostics on the fixture corpus are the corpus working as intended:
# `fixtures/unreachable-after-jump/positive/case.php` is unreachable code
# BECAUSE it is the positive control for the rule that reports unreachable
# code. Those diagnostics are ignored one by one, by exact rule key and
# exact file path. There is no `fixtures/**` pattern anywhere in this file:
# a new diagnostic in a fixture is therefore NOT waived - it fails the
# SonarCloud check until it is declared in
# ci/sonar-fixture-diagnostics.kyaml with a reason, an owner and an expiry.
#
# The criteria below and that declaration are kept in step by
# tests/sonar_fixture_gate_test.sh, which fails if either side gains an entry
# the other does not have, if a criterion is a pattern rather than a whole
# file, if a rule key is a wildcard, or if a declaration has expired.
#
# ONE ASSIGNMENT, ONE LIST
# A properties file gives the LAST assignment of a key precedence, so
# `sonar.issue.ignore.multicriteria` is declared ONCE, with a
# comma-separated list of criterion ids. Declaring it once per criterion
# would leave only the last criterion in force and silently drop the rest.
sonar.organization=hyperpolymath
sonar.projectKey=hyperpolymath_pons

sonar.issue.ignore.multicriteria=fixture-01,fixture-02,fixture-03,fixture-04,fixture-05,fixture-06
sonar.issue.ignore.multicriteria.fixture-01.ruleKey=php:S1763
sonar.issue.ignore.multicriteria.fixture-01.resourceKey=fixtures/unreachable-after-jump/positive/case.php
sonar.issue.ignore.multicriteria.fixture-02.ruleKey=php:S1763
sonar.issue.ignore.multicriteria.fixture-02.resourceKey=fixtures/unreachable-after-jump/positive/throw.php
sonar.issue.ignore.multicriteria.fixture-03.ruleKey=php:S3626
sonar.issue.ignore.multicriteria.fixture-03.resourceKey=fixtures/unreachable-after-jump/negative/case.php
sonar.issue.ignore.multicriteria.fixture-04.ruleKey=php:S112
sonar.issue.ignore.multicriteria.fixture-04.resourceKey=fixtures/unreachable-after-jump/negative/throw.php
sonar.issue.ignore.multicriteria.fixture-05.ruleKey=php:S112
sonar.issue.ignore.multicriteria.fixture-05.resourceKey=fixtures/unreachable-after-jump/positive/throw.php
sonar.issue.ignore.multicriteria.fixture-06.ruleKey=php:S100
sonar.issue.ignore.multicriteria.fixture-06.resourceKey=fixtures/unreachable-after-jump/negative/throw.php
